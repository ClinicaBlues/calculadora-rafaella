<style>
:root{--esp:#1C1310;--esp2:#2A1B15;--cream:#F3E9DA;--sand:#E4D3B8;--wine:#6E1B24;--terra:#C4642F;--line:#D6C4AA;--mut:#6E5D51}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--esp);color:var(--esp);font-family:"Jost","Avenir Next","Segoe UI",Roboto,Arial,sans-serif;padding:16px}
.box{width:100%;max-width:390px;background:var(--cream);padding:36px 28px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.rb{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;letter-spacing:.12em;margin:0 0 4px}
.rb i{font-style:normal;color:var(--terra)}
.k{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--terra);margin:0 0 18px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:32px;line-height:1.05;margin:0 0 22px}
label{font-size:14px;font-weight:500;display:block;margin-bottom:8px}
input{width:100%;font:inherit;font-size:16.5px;padding:14px;border:1px solid var(--line);border-radius:2px;background:#fff}
input:focus{outline:none;border-color:var(--wine)}
.pw{position:relative}
.pw input{padding-right:92px}
.pw button{position:absolute;right:6px;top:6px;bottom:6px;margin:0;width:auto;padding:0 12px;background:#fff;color:var(--wine);border:1px solid var(--line);font-size:14px}
button{margin-top:16px;width:100%;font:inherit;font-weight:500;font-size:16px;padding:15px;border:0;border-radius:2px;background:var(--wine);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#A2341E;font-size:14px;min-height:20px;margin-top:10px}
.n{font-size:12.5px;color:var(--mut);margin-top:14px;line-height:1.5}
</style>
</head>

    try { var html = await open(pw); try { sessionStorage.setItem('rafa-calc-pw', pw); } catch(x){} document.open(); document.write(html); document.close(); }
    catch(x){ b.disabled=false; b.textContent='Entrar'; if(!silent) e.textContent='Senha incorreta.'; }
  }
  document.getElementById('eye').onclick=function(){ var i=document.getElementById('p'); var show=i.type==='password'; i.type=show?'text':'password'; this.textContent=show?'Ocultar':'Mostrar'; i.focus(); };
  document.getElementById('f').onsubmit=function(ev){ ev.preventDefault(); go(document.getElementById('p').value.trim()); };
  try { var s=sessionStorage.getItem('rafa-calc-pw'); if(s) go(s, true); } catch(x){}
})();
</script>
</body>
